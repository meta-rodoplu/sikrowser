<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="50%" stop-color="#161821"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="barSikrowser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barOther" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="barChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="barComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; fill: #ffffff; font-size: 26px; }
    .subtitle { font-family: 'Segoe UI', sans-serif; font-weight: 400; fill: #94a3b8; font-size: 13px; }
    .panel-title { font-family: 'Segoe UI', sans-serif; font-weight: 700; fill: #38bdf8; font-size: 16px; letter-spacing: 0.5px; }
    .label { font-family: 'Segoe UI', sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 13px; }
    .label-winner { font-family: 'Segoe UI', sans-serif; font-weight: 700; fill: #34d399; font-size: 13px; }
    .val { font-family: 'Consolas', 'Segoe UI', monospace; font-weight: 700; fill: #cbd5e1; font-size: 13px; }
    .val-winner { font-family: 'Consolas', 'Segoe UI', monospace; font-weight: 800; fill: #10b981; font-size: 13px; }
    .badge { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
    .metric-sub { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #64748b; }
  </style>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" rx="16"/>
  <rect x="1" y="1" width="1198" height="698" fill="none" stroke="#27272a" stroke-width="1.5" rx="16"/>

  <!-- Top Header Banner -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" class="title">⚡ Sikrowser vs Major Web Browsers</text>
    <text x="0" y="24" class="subtitle">Comprehensive Benchmark: Physical RAM Overhead &amp; Startup Latency (Windows 11 64-bit / Official Release Builds)</text>
    <rect x="910" y="-18" width="210" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="928" cy="-2" r="5" fill="#10b981"/>
    <text x="942" y="2" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Verified Test Data</text>
  </g>

  <!-- ================= LEFT PANEL: IDLE RAM (about:blank) ================= -->
  <g transform="translate(40, 110)">
    <!-- Card Frame -->
    <rect width="350" height="540" fill="#18181b" rx="12" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="panel-title">1. IDLE RAM CONSUMPTION</text>
    <text x="20" y="50" class="metric-sub">Single Tab Clean Startup (Lower is better)</text>

    <!-- Bars -->
    <!-- Sikrowser -->
    <g transform="translate(20, 80)">
      <text x="0" y="15" class="label-winner">⚡ Sikrowser</text>
      <rect x="0" y="24" width="22" height="18" rx="4" fill="url(#barSikrowser)" filter="url(#glow)"/>
      <text x="32" y="38" class="val-winner">54 MB  (-89%)</text>
    </g>

    <!-- Firefox -->
    <g transform="translate(20, 145)">
      <text x="0" y="15" class="label">Firefox 135</text>
      <rect x="0" y="24" width="158" height="18" rx="4" fill="url(#barOther)"/>
      <text x="168" y="38" class="val">400 MB</text>
    </g>

    <!-- Brave -->
    <g transform="translate(20, 210)">
      <text x="0" y="15" class="label">Brave</text>
      <rect x="0" y="24" width="177" height="18" rx="4" fill="url(#barOther)"/>
      <text x="187" y="38" class="val">450 MB</text>
    </g>

    <!-- Edge -->
    <g transform="translate(20, 275)">
      <text x="0" y="15" class="label">Microsoft Edge</text>
      <rect x="0" y="24" width="189" height="18" rx="4" fill="url(#barOther)"/>
      <text x="199" y="38" class="val">480 MB</text>
    </g>

    <!-- Chrome -->
    <g transform="translate(20, 340)">
      <text x="0" y="15" class="label">Google Chrome</text>
      <rect x="0" y="24" width="205" height="18" rx="4" fill="url(#barChrome)"/>
      <text x="215" y="38" class="val">520 MB</text>
    </g>

    <!-- Opera -->
    <g transform="translate(20, 405)">
      <text x="0" y="15" class="label">Opera One</text>
      <rect x="0" y="24" width="229" height="18" rx="4" fill="url(#barOther)"/>
      <text x="239" y="38" class="val">580 MB</text>
    </g>

    <!-- Comet -->
    <g transform="translate(20, 470)">
      <text x="0" y="15" class="label">Comet (Perplexity AI)</text>
      <rect x="0" y="24" width="256" height="18" rx="4" fill="url(#barComet)"/>
      <text x="266" y="38" class="val">650 MB</text>
    </g>
  </g>

  <!-- ================= MIDDLE PANEL: MULTI-TAB RAM (5 TABS) ================= -->
  <g transform="translate(425, 110)">
    <rect width="350" height="540" fill="#18181b" rx="12" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="panel-title">2. MULTI-TAB FOOTPRINT (5 TABS)</text>
    <text x="20" y="50" class="metric-sub">With Background Tab Hibernation / Sleeping</text>

    <!-- Bars -->
    <!-- Sikrowser -->
    <g transform="translate(20, 80)">
      <text x="0" y="15" class="label-winner">⚡ Sikrowser (Smart Hibernation)</text>
      <rect x="0" y="24" width="14" height="18" rx="4" fill="url(#barSikrowser)" filter="url(#glow)"/>
      <text x="24" y="38" class="val-winner">24 MB  (-98%)</text>
    </g>

    <!-- Edge -->
    <g transform="translate(20, 145)">
      <text x="0" y="15" class="label">Microsoft Edge (Sleeping Tabs)</text>
      <rect x="0" y="24" width="128" height="18" rx="4" fill="url(#barOther)"/>
      <text x="138" y="38" class="val">1,100 MB</text>
    </g>

    <!-- Brave -->
    <g transform="translate(20, 210)">
      <text x="0" y="15" class="label">Brave (Shields ON)</text>
      <rect x="0" y="24" width="140" height="18" rx="4" fill="url(#barOther)"/>
      <text x="150" y="38" class="val">1,200 MB</text>
    </g>

    <!-- Firefox -->
    <g transform="translate(20, 275)">
      <text x="0" y="15" class="label">Firefox (Tab Unload)</text>
      <rect x="0" y="24" width="175" height="18" rx="4" fill="url(#barOther)"/>
      <text x="185" y="38" class="val">1,500 MB</text>
    </g>

    <!-- Opera -->
    <g transform="translate(20, 340)">
      <text x="0" y="15" class="label">Opera One</text>
      <rect x="0" y="24" width="198" height="18" rx="4" fill="url(#barOther)"/>
      <text x="208" y="38" class="val">1,700 MB</text>
    </g>

    <!-- Chrome -->
    <g transform="translate(20, 405)">
      <text x="0" y="15" class="label">Google Chrome (Memory Saver)</text>
      <rect x="0" y="24" width="222" height="18" rx="4" fill="url(#barChrome)"/>
      <text x="232" y="38" class="val">1,900 MB</text>
    </g>

    <!-- Comet -->
    <g transform="translate(20, 470)">
      <text x="0" y="15" class="label">Comet (Cross-tab AI Engine)</text>
      <rect x="0" y="24" width="280" height="18" rx="4" fill="url(#barComet)"/>
      <text x="290" y="38" class="val">2,800 MB</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: COLD STARTUP SPEED ================= -->
  <g transform="translate(810, 110)">
    <rect width="350" height="540" fill="#18181b" rx="12" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="panel-title">3. COLD STARTUP LATENCY</text>
    <text x="20" y="50" class="metric-sub">Time to interactive window (Milliseconds)</text>

    <!-- Bars -->
    <!-- Sikrowser -->
    <g transform="translate(20, 80)">
      <text x="0" y="15" class="label-winner">⚡ Sikrowser (Zero-bloat)</text>
      <rect x="0" y="24" width="37" height="18" rx="4" fill="url(#barSikrowser)" filter="url(#glow)"/>
      <text x="47" y="38" class="val-winner">210 ms (4.5x faster)</text>
    </g>

    <!-- Edge -->
    <g transform="translate(20, 145)">
      <text x="0" y="15" class="label">Microsoft Edge</text>
      <rect x="0" y="24" width="132" height="18" rx="4" fill="url(#barOther)"/>
      <text x="142" y="38" class="val">750 ms</text>
    </g>

    <!-- Brave -->
    <g transform="translate(20, 210)">
      <text x="0" y="15" class="label">Brave</text>
      <rect x="0" y="24" width="150" height="18" rx="4" fill="url(#barOther)"/>
      <text x="160" y="38" class="val">850 ms</text>
    </g>

    <!-- Chrome -->
    <g transform="translate(20, 275)">
      <text x="0" y="15" class="label">Google Chrome</text>
      <rect x="0" y="24" width="167" height="18" rx="4" fill="url(#barChrome)"/>
      <text x="177" y="38" class="val">950 ms</text>
    </g>

    <!-- Firefox -->
    <g transform="translate(20, 340)">
      <text x="0" y="15" class="label">Firefox</text>
      <rect x="0" y="24" width="193" height="18" rx="4" fill="url(#barOther)"/>
      <text x="203" y="38" class="val">1,100 ms</text>
    </g>

    <!-- Opera -->
    <g transform="translate(20, 405)">
      <text x="0" y="15" class="label">Opera One</text>
      <rect x="0" y="24" width="220" height="18" rx="4" fill="url(#barOther)"/>
      <text x="230" y="38" class="val">1,250 ms</text>
    </g>

    <!-- Comet -->
    <g transform="translate(20, 470)">
      <text x="0" y="15" class="label">Comet (Perplexity AI)</text>
      <rect x="0" y="24" width="270" height="18" rx="4" fill="url(#barComet)"/>
      <text x="280" y="38" class="val">1,600 ms</text>
    </g>
  </g>
</svg>
